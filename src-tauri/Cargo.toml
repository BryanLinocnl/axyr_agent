[package]
name = "axyr-agent"
version = "0.1.0"
description = "AXYR Agent IDE"
authors = []
license = ""
repository = ""
default-run = "axyr-agent"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "axyr_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "axyr-agent"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-fs = { version = "2.5.1", features = ["watch"] }
